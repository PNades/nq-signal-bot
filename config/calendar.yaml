# News releases, CME equity-index holidays and early closes (SPEC §1.2, §9, §12 step 4a).
# events: the owner's list (blackout: true, backtest + live) and the extra lines released with it
#   (blackout: false, calendar features only). Times are ET.
# live_extra: written by the pre-open job from step 22: other US events ForexFactory rates High at 08:30.
#   Live only: the backtest, labels and simulators never read it (§9).
# early_close_et is the cash close (13:00 ET), not CME's 13:15 futures close (§1.2).
# Built at step 4a by Claude Code from the agencies' schedules and archives (sources below);
# the owner confirms it at step 6.
meta:
  built: 2026-10-04
  window_from: 2025-08-04
  window_to: 2027-12-31
  timezone: America/New_York
  rule: 'Past releases as scheduled at 08:30 ET on the day: a postponement or cancellation counts only if announced before then (schedule_changes lists each with its announcement date). Future dates as currently published. Owner confirms at step 6; refreshed monthly.'
  published_through: {Advance GDP: 2026-10-29, CPI: 2026-12-10, Core PCE: 2026-12-23, FOMC Minutes: 2027-12-29, FOMC Press Conference: 2027-12-08, FOMC Rate Decision: 2027-12-08, FOMC Statement: 2027-12-08, Fed Chair: 2026-08-28, ISM Manufacturing PMI: 2026-12-01, ISM Services PMI: 2026-12-03, NFP: 2026-12-04, PPI: 2026-12-15, Retail Sales: 2026-12-16}
  chair:
  - {name: Powell, from: 2018-02-05, to: 2026-05-15, note: term as Chair ended Fri 2026-05-15}
  - {name: Powell, role: chair pro tempore, from: 2026-05-15, to: 2026-05-22, note: Board named him chair pro tempore 2026-05-15 until Warsh sworn in; no public appearances in this span; stays on as Governor (term to Jan 2028)}
  - {name: Warsh, full_name: Kevin M. Warsh, from: 2026-05-22, note: Senate confirmed 2026-05-13 (54-45); sworn in and chosen FOMC chairman 2026-05-22; Fed styles him 'Chairman'}
  research_notes:
  - 'bls: All past dates verified against BLS archive pages (bls.gov/bls/news-release/*.htm) and the 2025/2026 yearly schedule pages; every release in scope was at 08:30 ET. The empsit archive listing omitted the Nov-2025 release; it was confirmed directly (empsit_12162025: Tue 2025-12-16 08:30).'
  - 'bls: Last published dates: NFP 2026-12-04 (Nov 2026), CPI 2026-12-10 (Nov 2026), PPI 2026-12-15 (Nov 2026). The 2027 BLS schedule is NOT yet published (bls.gov/schedule/2027/home.htm returns 404 as of 2026-10-04); re-check in Nov/Dec 2026.'
  - "bls: Original (pre-shutdown) dates come from the BLS revised-dates page 'Previously Scheduled' column, except CPI Sep 2025 (2025-10-15, from the original 2025 schedule, not on that page; the reschedule notice is dated 2025-10-10)."
  - 'bls: announced 2025-10-01 = start of the funding lapse (00:01 ET). BLS suspended all operations and published nothing during the lapse per the DOL contingency plan (source nasdaq_bls_cease_ops; NBC nbc_oct3_no_jobs confirms no Oct 3 release). I did not find a dated BLS notice per release; the lapse itself is treated as the announcement for every release scheduled Oct 1 - Nov 12.'
  - 'bls: UNCERTAIN: CPI Oct 2025 (sched Thu 2025-11-13) and PPI Oct 2025 (sched Fri 2025-11-14). The shutdown ended late 2025-11-12 (bill signed ~night of Nov 12), i.e. before these 08:30 slots. No BLS notice reinstating them was issued and nothing was released, so they are treated as not scheduled (announced 2025-10-01). Formal cancellations came later (CPI 2025-11-21, PPI 2025-12-08).'
  - "bls: UNCERTAIN: PPI Nov 2025 'announced' 2025-11-25 is based on the Sep-2025 PPI release text (that day 08:30) saying subsequent PPI releases would also be delayed; the explicit Jan-14 date was posted 2025-12-08 (BLS tweet / investinglive). Either way it is before the 2025-12-11 slot."
  - 'bls: UNCERTAIN: PPI Jan 2026 and Feb 2026 reschedule announcement dates are only bounded: the new dates were stated in the 2026-01-30 and 2026-02-27 PPI releases respectively (could have been posted earlier on the revised-dates page). Both are before the original slots (Feb 12, Mar 12).'
  - "bls: PPI Dec 2025's 'previously scheduled' date (2026-01-14) is as stated by BLS; that slot was then reused by the Nov-2025 PPI, so 2026-01-14 does carry a PPI release. Dec-PPI move to Jan 30 announced 2025-12-11 (secondary source roic.ai, not a BLS page)."
  - "bls: 2026 lapse: CNN 2026-02-02 reported BLS would delay the Jan jobs report; new dates (NFP Feb 11, CPI Feb 13, JOLTS Feb 5) announced Wed 2026-02-04 after funding was restored. A roic.ai item of 2026-02-04 said BLS had 'confirmed' CPI on Feb 11, contradicting this; the BLS revised-dates page (updated 2026-02-12) and the actual release date (2026-02-13) confirm the move. Exact time of the Feb 4 announcement not found (articles published midday ET)."
  - 'bls: Second 2026 shutdown (Feb 14 - Apr 30, 2026) was DHS-only; BLS unaffected. No funding lapse affected BLS around 2026-10-01 (Sep-2026 jobs report released on schedule 2026-10-02).'
  - 'bls: Time-of-day of announcements generally not available; all listed announcement dates are at least one calendar day before the affected 08:30 slot, so the exact time does not matter for the as-of-08:30 rule.'
  - "bea: Q3-2025 GDP: BEA itself titled the 2025-12-23 release 'Gross Domestic Product, 3rd Quarter 2025 (Initial Estimate) and Corporate Profits (Preliminary)' - NOT 'advance'. BEA (2025-12-10): the advance estimate was canceled; the Dec 23 initial estimate 'replaces the typical advance and second estimates'; the Jan 22 2026 'Updated Estimate' replaces the third. I listed Dec 23 under name 'Advance GDP' because it was the first print of Q3; drop it if your rule is strictly 'advance' by title."
  - "bea: Shutdown 2025-10-01..2025-11-12: no per-release postponement notices were posted before the original dates (agencies were closed). BEA's schedule page still listed 2025-10-30/31 on 2025-10-17 under a banner 'Due to a lapse in appropriations, this website is not being updated'. Under a strict 'counts only from announcement' rule, 2025-10-16 (Retail), 2025-10-30 (Adv GDP), 2025-10-31 (PCE) and 2025-11-14 (Retail) were still formally 'scheduled' at 08:30 on their day but were universally known not to happen. Field announced_implicit: 2025-10-01 marks this; you decide whether to blackout those days."
  - "bea: Post-shutdown 10:00 ET PCE releases: 2025-12-05 (Sep 2025) and 2026-01-22 (Oct+Nov 2025; the same day GDP Q3 'Updated Estimate' was at 08:30). The original 2025 schedule also had PCE at 10:00 on 2025-11-26 and 2025-12-19 (never held). From 2026 BEA releases PIO at 08:30 on the same day as GDP (BEA blog 2026-02-09)."
  - "bea: 2026 funding lapses: Commerce (BEA, Census) got full-year FY2026 CJS appropriations in January 2026; the 2026-01-31..02-03 lapse and the ~76-day DHS-only partial shutdown (ended 2026-04-30) did not touch Commerce. All 2026 BEA/Census moves above are announced as residual 'post-shutdown' effects of the 2025 lapse. Wikipedia's 2026 budget page loosely implies Commerce was in the Jan 31-Feb 3 lapse; BEA/Census pages show no disruption then (low confidence on that point only)."
  - 'bea: FY2027: CR (P.L. 119-103) funds the government through 2026-12-11. A lapse from 2026-12-12 could hit Retail Sales 2026-12-16 and PCE/GDP 2026-12-23. Re-check in early December.'
  - "bea: Furthest published dates: BEA 2026-12-23 (2027 schedule not yet published); Census Advance Retail 2026-12-16 (Dec 2026 data 'TBA'); ISM 2026-12-01 Mfg / 2026-12-03 Services (no 2027 table yet); NYSE holidays through 2028 (window cut at 2027-12-31)."
  - "bea: ISM is private and was not affected by the shutdown; the dates come from ISM's calendar (2025 table via wayback 2025-10-09, 2026 table current 2026-09-30). 2026-01-05 Manufacturing was moved for an ISM holiday; 2026-07-06 Services for July 3. I did not check each past release's press release one by one."
  - 'bea: Census retail original dates: 2025 from the Census schedule page (wayback 2025-10-12 / 2025-11-16); 2026 originals (Jan 15, Feb 17, Mar 16, Apr 16) from the 2026 economic-indicator calendar (wayback 2025-11-01/16). Census govdelivery bulletins carry no visible date, so exact announcement days for the Dec 2025-Mar 2026 reschedulings are bracketed by wayback captures.'
  - 'bea: CME: 2025-11-28 (day after Thanksgiving, early close) CME Globex was halted for about 10 hours by the CyrusOne CHI1 cooling failure; ES/NQ reopened that morning (around 08:30 ET per press reports, not verified to the minute). You may want to exclude that session.'
  - 'bea: CME equity-index futures early-close time (12:15 CT / 13:15 ET; settlement 12:00 CT) comes from CME holiday memos, not checked for each date because cmegroup.com timed out. On full NYSE holidays (e.g. Labor Day, Good Friday) CME holiday hours differ by holiday. Good Friday sometimes has a short equity session when NFP is released (2026-04-03); check the CME Good Friday advisory if needed: https://www.cmegroup.com/tools-information/holiday-calendar/files/2026/2026-good-friday-clearing-advisory.pdf'
  - 'bea: No special NYSE closures (e.g. national day of mourning) found between 2025-08-04 and 2026-10-04. NYSE stayed open on 2025-12-24 (13:00 close) and 2025-12-26 (full day) even though federal employees had those days off.'
  - 'fed: 2027 FOMC schedule is published (announced 2025-09-05). The 2027 table footnote also gives a tentative Jan 25-26 2028 meeting, included. 2027-28 dates are tentative until confirmed at the preceding meeting.'
  - 'fed: Minutes dates through the Oct 27-28 2026 and Dec 8-9 2026 meetings are on the Fed calendar (Oct 7, Nov 18, Dec 30 2026). 2027-28 minutes dates are derived (decision + 21 days); the Fed can shift one by a day around holidays (Dec 2025 minutes came Dec 30, not Dec 31).'
  - 'fed: 2027-28 press conferences are assumed (every meeting since 2019 has had one); not yet on the Fed calendar.'
  - "fed: No unscheduled/intermeeting rate actions in the window. Only off-cycle FOMC action: 2025-08-22 notation vote approving the revised Statement on Longer-Run Goals (released with Powell's Jackson Hole speech) - not a rate decision, not listed."
  - 'fed: FF actuals: Sep 17 2025 cut to 4.00-4.25, Oct 29 2025 cut to 3.75-4.00, Dec 10 2025 cut to 3.50-3.75, holds Jan-Jul 2026, Sep 16 2026 hike to 3.75-4.00.'
  - 'fed: No early-2026 semiannual Monetary Policy Report testimony took place (Fed MPR page lists none; first 2026 MPR testimony was Warsh, Jul 14-15).'
  - "fed: Excluded from Fed Chair (not Chair at the time): Warsh Senate Banking confirmation hearing 2026-04-21 10:00 (FF now lists it as 'Fed Chairman Warsh Testifies', high); Senate Fed Chair nomination vote 2026-05-13 14:40 (FF 'Fed Chair Nomination Vote', high); Powell as Governor 2026-05-31 20:30 JFK award remarks (FF 'FOMC Member Powell Speaks'); Warsh swearing-in at the White House 2026-05-22 (not on Fed calendar or FF). Owner may want the Apr 21 hearing and May 13 vote added as high-impact items."
  - 'fed: Excluded as unscheduled: Powell video statement Sun 2026-01-11 (DOJ subpoena; on the 2026 speeches page, not on the calendar).'
  - "fed: Every Chair event time is the Fed calendar's scheduled start and matches the FF dateline exactly. 2025-12-01 (20:00), 2026-03-21 (Saturday) are outside RTH."
  - "fed: The 'as scheduled at 08:30 ET that day' rule could not be checked per event from archives; all listed events are on the Fed's calendar and none carries an FF 'surprise / added late' notice. 2025-10-09 is itself at 08:30 (pre-recorded)."
  - 'fed: No Warsh appearances announced yet for Oct-Dec 2026 on the Fed calendar or FF (checked 2026-10-04).'
  - "fed: nfs.faireconomy.media only serves ff_calendar_thisweek.json (nextweek/lastweek 404); it confirms 'FOMC Meeting Minutes' 2026-10-07 14:00 High."
