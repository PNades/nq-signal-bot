# Global trading / execution settings (SPEC §11 "Where settings live").
# Values are the SPEC's start values and the docs/feature_spec.md F15/F16 values the owner approved at step 6 (2026-10-05).
# Machine resources (max_workers, max_fold_mem_gb, low_memory) may be overridden per machine in config/local.yaml.

# --- Storage (§11 Storage, path convention) -------------------------------------------------
paths:
  root: "nqbot/"        # set at step 4b (SSD day): folder relative to the SSD's drive, e.g. "nqbot/". The drive is found
                        # by scanning mounted drives for the marker file .nqbot_drive, never by drive letter.
  # Derived from root (never repo-relative): data_dir = <root>/data, raw_dir = <root>/data/raw,
  # live_dir = <root>/data/live, models_dir = <root>/models, reports_dir = <root>/reports,
  # log_dir = <root>/logs, tmp_dir = <root>/tmp
min_free_gb: 50
min_free_gb_live: 20
backup:                 # nqbot backup: data/raw/skylit/ -> Google Drive with rclone (§11 Storage; owner 2026-10-05)
  rclone_remote: gdrive         # the owner's rclone Google Drive remote (made once with `rclone config`)
  drive_folder: "NQ bot backup" # folder on that Drive; the copy lands in <drive_folder>/raw/skylit/
  rclone_exe: rclone            # the rclone command (or its full path if it isn't on PATH)

# --- Month ledger (§7 rule 2b) ----------------------------------------------------------------
months: {1: "2025-10", 2: "2025-11", 3: "2025-12", 4: "2026-01", 5: "2026-02", 6: "2026-03", 7: "2026-04", 8: "2026-05", 9: "2026-06", 10: "2026-07", 11: "2026-08", 12: "2026-09"} # set at step 4b (SSD day): development 1-6, walk-forward test 7-9, sealed 10-12 (+ top-up)
                        # format: {1: "2025-10", 2: "2025-11", ..., 12: "2026-09"} (month number -> YYYY-MM;
                        # 1-6 development, 7-9 walk-forward test, 10-12 sealed); read by nqbot.months
min_month1_sessions: 10
min_new_sealed_months: 2

# --- Machine resources (overridable in config/local.yaml) ----------------------------------
max_workers: null       # null = all cores but 2; capped at run time by free RAM (§11 Low memory)
max_fold_mem_gb: 10
low_memory: true        # 16 GB laptop mode (§11 Low memory)
grid_sample_frac: 1.0

# --- Session (§1.2) ---------------------------------------------------------------------------
session:
  flat_by: "15:59"      # owner; a model constant (changing it means a rebuild)
min_minutes_before_flat: 14   # owner's rule, not tuned: last entry 15:45

# --- Operations (§9, §11 Overnight jobs) -------------------------------------------------------
ops:
  job_lock_window: "08:30-16:15"   # ET, trading days: no nqbot run job inside it (from step 22)
  job_lock_window_enforced: false  # step 22 sets true (§11: the ban starts once live trading starts)
preopen_start: "08:30"
tempest_draft_cutoff_et: "09:25"  # §3.1 Tempest (owner 2026-10-22): a pre-open row still a draft is re-pulled
tempest_draft_retry_min: 5        # every N minutes until the cutoff, then used and flagged (step 22)
archive_time: "17:05"
heartbeat_min: 15
inactivity_alert_days: 5
retrain_every_months: 1

# --- Execution and risk (§3.5, §5.5b, §6, §10.3) --------------------------------------------
order_latency_sec: 1.0       # placeholder until step 21 measures the 95th percentile
default_risk_usd: 333
max_entry_slip_ticks: 4
exit_slippage_ticks: 1       # set at step 13 (95th percentile stop slippage, months 1-4)
default_commission_per_mini_rt: 4.68    # labeling default (owner's MFFU rate, all fees)
default_commission_per_micro_rt: 1.90   # labeling default (owner's MFFU rate, all fees)
exit_retry_window_sec: 120
flat_retry_min: 11
flat_alert_sec: 30
unknown_alert_min: 5
webhook_timeout_sec: 5
entry_ttl_sec: {a: 5, b: 5, c: 60, d: 60}   # per entry style; start values approved 2026-10-05, frozen on months 1-4 (step 13/19)
stop_buffer: 5                    # NQ pts start; frozen at step 13 (F16.4); approved 2026-10-05 (feature_spec F15)
stop_buffer_floor: {QQQ: 4.25, NDXP: 6.50, chart: 0}  # NQ pts, per source of the level a stop sits beyond (§6.2, F7);
                                  # FROZEN (owner 2026-10-19, §13 Q8b-frozen; step 8b, recordings 10-09 to 10-19, findings
                                  # R15/R16): QQQ = the gate's crossing p95 4.046 rounded up to a tick; NDXP (QQQ x k N=20)
                                  # = the larger of its five-day ndxp-select p95s (every board 5.752, crossings 6.446; k
                                  # with FRED's 10-16 close) rounded up to a tick: 6.50 (owner 2026-10-23; was 6.25 from
                                  # 5.61 / 6.18 with 10-19's k a day stale); chart levels no mapping floor
entry_order_type:            # start values per entry style (§5.5b); frozen on months 1-4
  a: marketable_limit
  b: marketable_limit
  c: stop_limit
  d: limit
enabled_entry_styles: [c, d]     # (a)/(b) are built at step 19 (order flow); step 20 decides whether they stay
style_tie_ev_r: 0.05
max_target_candidates: 10
pair_build_min_rr: 0.8
swing_lookback_sec: 300
lives_dust_usd: 25
max_loss_run_rate: 0.15          # §6.5b start value of each account's max_loss_run_rate (renamed from max_three_loss_rate,
                                 # owner 2026-10-14): the share of L-trade all-full-loss runs, L = lives at a full drawdown; 0.15 for every N
be_trigger:                  # the breakeven rules chosen per fold (<= 4, §6.4; feature_spec F16.2; approved 2026-10-05)
  - none
  - first_structure            # owner's rule (F11.3)
  - {r_multiple: 1.0}          # first trade >= 1.0 x the stop distance in favour
  - {r_multiple: 0.5}
be_offset_ticks: 1                # fixed; re-checked once step 13 measures exit_slippage_ticks; approved 2026-10-05 (feature_spec F15)

# --- Supervision and live engine (§9) ----------------------------------------------------------
guard_check_sec: 10
guard_flat_grace_sec: 30
max_engine_restarts: 3
guard_port: 8731                  # approved 2026-10-05 (feature_spec F15)
engine_port: 8732                 # approved 2026-10-05 (feature_spec F15)
ui_port: 8733                     # approved 2026-10-05 (feature_spec F15)
sleep_detect_sec: 30
clock_max_offset_ms: 250
clock_check_min: 10
ntp_server: "time.cloudflare.com"  # step 22 confirms it answers on each network; approved 2026-10-05 (feature_spec F15)
feed_stale_sec: 5
feed_lag_max_ms: 500
feed_recovery_sec: 60
deadman_url: ""

# --- Skylit (§3.1) ---------------------------------------------------------------------------------
skylit_symbols:              # map name -> API option root (§3.1). SPX's 0DTE board is the SPXW root: the API's SPX
  QQQ: QQQ                   # root holds only the AM-settled monthlies (Skylit OpenAPI, 2026-10-05); step 7
  NDXP: NDXP                 # confirms with /v1/symbols and the stored expirations
  SPY: SPY
  SPX: SPXW
skylit_metric: gamma         # decided (§3.1 Metric)
skylit_max_expirations: 1    # decided (§3.1 Expirations), history and stream alike
skylit_max_strikes: "all"    # step 7 (owner 2026-10-06): whole 0DTE chain; API maxStrikes is not "N nearest spot" (200 cut NDXP nodes, §3.1)
strike_edge_margin: 5
skylit_stale_sec: 45
power_poll_sec: 5            # owner 2026-10-19 (§9, §13 Q-power): how often recordings (live: step 22) read the power source
battery_warn_step_pct: 10     # on battery: a warning at each further drop of this many points below the level at the switch
battery_entry_floor_pct: 30   # on battery at or below this %: live allows no new entries (step 22); warnings only above it
skylit_map_stale_sec: 5      # owner 2026-10-14 (§9, §13 Q-mapstale): a map whose newest board is older blocks new entries on
                             # its zones; past skylit_stale_sec the feed-failure rule applies to it (live only)
skylit_credit_warn: 10000
map_latency_sec: 1.16         # FROZEN (owner 2026-10-19, §13 Q8b-frozen; step 8b, recordings 10-09 to 10-19, findings
                             # R15/R16): p99.9 of arrival - tau (tau = floor(asOf) + 1 s) over the synced-clock recordings
                             # 10-12/10-15/10-16, connection stretches left out (10-19 before its standby: 0.76 s);
                             # live may raise it only by the §3.1 Ingest rule (was 0.59 from 10-07)
skylit_reach_margin_min: 30  # §3.1 Backfill: a window is pulled only if it starts after now - 365 days + this margin
skylit_max_failures_in_row: 5   # §3.1 Backfill (decision 4, 2026-10-06): a failing window/date is recorded and skipped;
                                # this many in a row stop the backfill cleanly (status failures)
skylit_dropped_extra_tries: 3     # §3.1 Backfill (owner 2026-10-06): a window whose connection dropped (maybe charged)
                                  # gets up to this many more tries while still in reach, in the end-of-night retry pass
skylit_dropped_retry_credits_per_night: 500  # §3.1 Backfill (owner 2026-10-06): cap on those tries' credits per night
databento_damage_baseline_sessions: 20  # §3.2 Dataset condition (owner 2026-10-09): a non-available day's completeness is
                                        # compared with this many nearest sessions whose UTC dates are all available
# §3.2 Dataset condition (owner 2026-10-09, §13 Q8-degraded): handling of non-available days, fixed from
# completeness only, before any outcome on those days was looked at (steps 11/13 apply it)
databento_damage_excess_minutes: 5  # a part is damaged if its empty minutes exceed the normal max by more than this, or
databento_damage_gap_sec: 120       # its longest gap exceeds both the normal max gap and this many seconds
databento_damage_window_pad_min: 15 # a small RTH damage drops only events whose span comes within this of a damaged minute
databento_damage_session_minutes: 30  # damaged RTH minutes (excess, any series) above which the whole session is dropped
                                  # (25 each; can go if Skylit confirms a dropped call isn't charged), shared with the
                                  # one paid re-pull of a window, dark-pool date or Tempest range whose kept copy is cut off or corrupt
skylit_alongside_reserve_credits: 1000  # §3.1 Backfill (decision 2): credits the backfill never spends, kept for the
                                # step-7 checks running alongside it (stream-record worst case 92, parity 25,
                                # late-print mornings + compare up to ~300 when the lookback dates aren't cached
                                # yet, Tempest re-pull a few; about 2x margin)
skylit_pack_margin: 0.10     # step-7 report: the credit shortfall is (backfill estimate x (1 + margin)) - balance
skylit_credit_packs:         # §3.1 top-up price list (owner, 2026-10); the step-7 report names the cheapest cover
  - {credits: 55000, usd: 50}
  - {credits: 175000, usd: 150}
  - {credits: 480000, usd: 400}

# --- News blackouts (§9) ---------------------------------------------------------------------------
blackout_before_min: 30      # owner
blackout_after_min: 60       # owner
news_flatten_lead_sec: 30    # must exceed order_latency_sec + webhook_timeout_sec + 1 s
calendar_poll_min: 15
# ForexFactory weekly feed (checked 2026-10-04): JSON, times in ET with the UTC offset
# (e.g. "2026-10-05T10:00:00-04:00"); covers the current week only, Sunday to Saturday.
# The XML twin uses GMT times: not used.
calendar_feed_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
# Proposed at step 4a; approved by the owner at step 6 (2026-10-05).
# Canonical calendar.yaml name -> ForexFactory titles (country USD), matched by exact title.
# These are the owner's list: blackout: true whatever ForexFactory rates them.
# Any OTHER US event ForexFactory rates High in the feed at the 08:30 pre-open gets a live-only
# blackout (calendar.yaml live_extra; never used by backtest or labels; each one logged, §9).
news_title_map:
  blackout:
    NFP: ["Non-Farm Employment Change"]
    FOMC Rate Decision: ["Federal Funds Rate"]
    FOMC Statement: ["FOMC Statement"]
    FOMC Press Conference: ["FOMC Press Conference"]
    FOMC Minutes: ["FOMC Meeting Minutes"]
    # Every scheduled Chair testimony and speech, whatever its rating. ForexFactory titles use the Chair's
    # name ("Fed Chairman Warsh ..." since 2026-05-22; it renamed Powell's past Chair speeches to
    # "FOMC Member Powell Speaks"). Update when the Chair changes.
    Fed Chair: ["Fed Chairman Warsh Speaks", "Fed Chairman Warsh Testifies", "Fed Chair Nomination Vote"]   # incl. a nominee's hearing and the confirmation vote (owner 2026-10-05, §9)
    CPI: ["CPI m/m", "CPI y/y"]
    Core PCE: ["Core PCE Price Index m/m"]
    PPI: ["PPI m/m"]
    Advance GDP: ["Advance GDP q/q", "Advance GDP Price Index q/q"]
    ISM Manufacturing PMI: ["ISM Manufacturing PMI"]
    ISM Services PMI: ["ISM Services PMI"]
    Retail Sales: ["Retail Sales m/m"]
  # Extra lines of the listed releases (same time as their release): blackout: false, calendar features only.
  no_blackout:
    Unemployment Rate: ["Unemployment Rate"]
    Average Hourly Earnings: ["Average Hourly Earnings m/m"]
    FOMC Economic Projections: ["FOMC Economic Projections"]   # 14:00 with the decision, projection meetings only
    Core CPI: ["Core CPI m/m"]
    Core PPI: ["Core PPI m/m"]
    Core Retail Sales: ["Core Retail Sales m/m"]
    PCE Price Index: ["PCE Price Index m/m"]
    Personal Income: ["Personal Income m/m"]
    Personal Spending: ["Personal Spending m/m"]

# --- Gameplans (§5.6) ------------------------------------------------------------------------------
gameplan_min_days: 20
gameplan_ny_am_end: "12:00"    # F8: the ny_am scenario set applies 09:30 to this (ET), the session set after (owner 2026-10-07)
gameplan_model: claude-opus-5-5   # step-9 parser (§3.4): Claude API model for gameplan -> §5.6 JSON
gameplan_effort: medium           # output_config.effort for the parse call
gameplan_max_tokens: 16000        # per parse call (thinking + JSON); also the worst-case output cost estimate
gameplan_usd_per_mtok: {input: 4.0, output: 20.0}   # the model's list price, for the printed estimate (rule 2)
gameplan_max_usd_per_file: 1.00  # `nqbot gameplan <file>` above this worst case needs --approve-usd (rule 2)

# --- Training, tuning, gates (§6.5b, §6.8, §7) -----------------------------------------------------
tuning_start:
  min_ev_r: 0.20
  min_target_prob: 0.40
threshold_grid:              # 5 x 5 (§6.5b; feature_spec F16.1; approved 2026-10-05)
  min_ev_r: [0.05, 0.10, 0.20, 0.30, 0.45]
  min_target_prob: [0.30, 0.40, 0.45, 0.50, 0.60]
last_life_grid: [0.10, 0.20, 0.33]           # fixed, owner
profile_ev_quantiles: {conservative: 0.67, protect: 0.90}   # fixed
profile_risk_multiplier: {aggressive: 1.0, normal: 1.0, conservative: 0.5, protect: 0.33}
style_set_grid: [[a, b, c, d], [a, b, c], [a, b], [c, d], [c], [d]]   # F16.3; approved 2026-10-05
recency_halflife_months:     # weights the pair scorer's rows; searched once per scorer (F16.6; approved 2026-10-05)
  start: 6                     # code reads recency_halflife_months.start / .grid
  grid: [3, 6, 12, null]       # null = no recency weighting
lgbm_grid:                     # F16.7; approved 2026-10-05; searched once per model by day-blocked CV log-loss
  cv_folds: 3
  search:
    num_leaves: [7, 15, 31]
    min_data_in_leaf: [100, 500]     # unweighted rows
  fixed:
    learning_rate: 0.03
    num_boost_round_max: 2000
    early_stopping_rounds: 50       # on the held-out CV fold; the final fit uses the mean best round count
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10
    max_bin: 63
    deterministic: true
    seed: 42
ablation_groups:               # §7 rule 5; memberships in feature_spec F16.8; approved 2026-10-05
  - trigger_model
  - trinity
  - confluence
  - day_type
  - area_events
  - stop_candidate_5
  - map_shape
  - order_flow_extras           # owner 2026-10-16 (B2, B3) and 2026-10-17 (B1)
  - approach                    # owner 2026-10-16 (B4)
  - post_cross_retests          # owner 2026-10-23 (§5.2 post-cross retests, F2.6b)
bootstrap_paths: 500
default_max_three_loss_rate: 0.15
gate_account:                # §6.5b: account-independent choices and gates 16/20
  risk_usd: 333              # = default_risk_usd
  max_minis: 2
  max_micros: 20
  max_three_loss_rate: 0.15  # = default_max_three_loss_rate
  daily_caps: false
  lives: false
  stop_at_target: false
gates:
  gate_calib_max: 0.05
  gate_pass_rate_min: null   # owner decides (report-only until set)
