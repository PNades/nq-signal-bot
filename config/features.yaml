# Detector, mapping and structure parameters (SPEC §11 "Where settings live", §5).
# Values are the SPEC's start values and the docs/feature_spec.md F15 start values the owner approved at
# step 6 (2026-10-05); the step-13/19 grids are tune_grids_13 / tune_grids_19 (F16). Frozen execution parameters are added here at step 13/19,
# marked `frozen_from: months 1-4` (§7.1).
features_version: 25               # 1: golden-zone upper fib 0.786 -> 0.79; 2: expected-move (sigma) levels F3.11; 3: mapping-dislocation guard F1.8 (owner 2026-10-14); 4: opening-range fib 09:45 start, 10:30 redraw, flips, and feature additions B2-B5 (owner 2026-10-16); 5: features during a dislocation block, guard windows reset at the session start only, B1 volume baselines and relative detector thresholds (owner 2026-10-17); 6: Skylit's VIX row, its close only as vix_ref_chg (Q-vix, owner 2026-10-20); 7: expected-move unit = Tempest's em_1d_pct as stored (Q-svxwknd, owner 2026-10-22); 8: post-cross retests and cross features F2.6b, gameplan zones break past the far edge (Q-flipretest, owner 2026-10-23); 9: previous-session profile levels and context, single-contract weekly, xb_settled_1m, stacked single prints, multi-expiration context (Q-amt, Q-multiexp, owner 2026-10-24; feature freeze until step 16); 10: air pockets below 10% of the King, was 2% (owner 2026-10-24, a correction of an existing definition); 11: pika-cloud members are relevant nodes, 0.25 in / node_drop_pct out (owner 2026-10-24, a correction); 12: in_pika_cloud on S&P maps = cloud band +/- es_zone_proximity contains the ES price (owner 2026-10-24); 13: Trinity and es_at_level by the overlap rule over [touch, t], aligned node not crossed at t (owner 2026-10-24); 14: owner answers to the Skylit-understanding questions (2026-10-25): lean = above minus below on magnitude velocity, confirmed King / ceiling / floor by lead time (roll_switch_min_sec, king_switch_min_sec, node_switch_incumbent_max_share), price switches at once from futures vs band, signed roll_steps, Trinity counts provisional roles; 15: golden-zone flip and 10:30 redraw become step-13 variants golden_zone_flip / golden_zone_redraw_1030, start true (Q-fibvariants, owner 2026-10-26); 16: a new extreme before 10:00 that reverses the golden-zone orientation makes a new zone (owner 2026-10-26); 17: S&P entry features for VAH/VAL area events, es_at_level and area_sp_* (Q-areasp, owner 2026-10-26; built with area events at step 19); 18: Q-areasp follow-ups: stats from the first-overlapping node still counting, area_sp_count null during an S&P block like trinity_count, overlap checked at every ES/NQ trade and board apply (owner 2026-10-26); 19: es_at_level during a dislocation block by the narrower Q-dislguard-2 (a) rule, level and area events, F1.8 fixed to match (owner 2026-10-26); 20: step-13 variants va_edge_sweep and prev_profile_anchor (Q-vaedge, owner 2026-10-26; start = current rules); 21: golden zone split into a shallow (0.5-0.618) and a deep (0.618-0.79) zone, each its own container, golden_zone_part (Q-gzsplit, owner 2026-10-27); 22: the deep golden zone is touched only by a trade past 0.618, its own touch group (Q-gzsplit answer, owner 2026-10-27); 23: day-type VWAP/POC crosses on settled 5-minute bars (Q-dtcross, owner 2026-10-27); 24: POC crosses out of the day-type label, trend_max_poc_crosses removed (Q-dtcross follow-up, owner 2026-10-27); 25: with_day_direction and vwap_side_vs_trade in the structure model and pair scorer (Q-trenddir, owner 2026-10-27); nothing was built under 0-24

# --- Structure (§5.2-§5.4b) -----------------------------------------------------------------------
zone_proximity: 5                 # NQ pts; tuned at step 13 (F16.4); approved 2026-10-05 (feature_spec F15)
es_zone_proximity: null         # derived, not set: zone_proximity x ES / NQ price at the session open (F0.11)
confluence_tol: 10                # NQ pts; tuned at step 13 (F16.4); approved 2026-10-05 (feature_spec F15)
max_zone_width: 60              # NQ pts
rearm_dist: 10                  # NQ pts
entry_reprice_tol: 2            # NQ pts
# Chart-level half-widths per level type (NQ pts; F5.14, F15 rows 3-4, approved 2026-10-05): start values for steps 11-12,
# replaced at step 13 by the reaction-distance report (frozen on months 1-4), never above the cap.
chart_level_half_width: {vwap: 4, vwap_band: 4, poc: 4, lvn: 4, on_extreme: 4, pdh_pdl: 4, prior_rth: 4, prior_week: 4, ib: 4, retested_extreme: 4, single_print: 0, em_level: 4, va_edge: 4}
chart_level_half_width_cap: {vwap: 12, vwap_band: 12, poc: 12, lvn: 12, on_extreme: 12, pdh_pdl: 12, prior_rth: 12, prior_week: 12, ib: 12, retested_extreme: 12, single_print: 6, em_level: 12, va_edge: 12}
node_band: {QQQ: 0.5, SPY: 0.5, SPX: 5, NDXP: 20}   # in each underlying's own units; NDXP confirmed at step 13
min_node_pct_of_king: 0.25      # owner
node_drop_pct: 0.20
lean_window: 1                  # minutes; owner 2026-10-05 (accumulation shifts quickly); fixed
velocity_lookback_sec: 60
regime_band: 1                  # % of spot; owner 2026-10-05; fixed
flip_margin: {qqq_node: 0, ndxp_node: 0, vwap: 0, vwap_band: 0, poc: 0, lvn: 0, single_print: 0, dark_pool: 0, on_extreme: 0, pdh_pdl: 0, prior_rth: 0, prior_week: 0, ib: 0, retested_extreme: 0, em_level: 0, va_edge: 0}
                                # NQ pts per level type (start 0); tuned at step 13 per group (tune_grids_13), written per type;
                                # ES-side types use their NQ counterpart x ES/NQ at the open (F0.11): SPY/SPX nodes = gex_nodes group,
                                # SPY dark pools = chart_lines, ES ON high/low and PDH/PDL = highs_lows
flip_bar_minutes: 5
ib_fib_start_minute: 15         # owner rule, never tuned (golden zone opens 09:45; owner 2026-10-16, was 20)
ib_lock_minute: 30              # owner rule, never tuned (all setups from 10:00)
ib_redraw_minute: 60            # owner 2026-10-16, never tuned: one fib/IB redraw at 10:30 if the range widened after 10:00 (§5.8, F10)
golden_fib_levels: [0.5, 0.618, 0.705, 0.79]   # owner rule, never tuned (§5.8, F10): the fib levels recorded in the golden zone
golden_zone_upper_fib: 0.79     # owner 2026-10-14 (was 0.786), never tuned: the zone's far edge (settled-past invalidation, stop candidate 2)
golden_zone_split_fib: 0.618    # owner 2026-10-27 (Q-gzsplit), never tuned: shallow zone 0.5-0.618, deep zone 0.618-0.79; a settle past it breaks the shallow zone only
golden_zone_flip: true          # owner 2026-10-26 (Q-fibvariants): step-13 variant (tune_grids_13.golden_zone_variants); off = the 0.79
                                # invalidation ends the setup, the drawing keeps its orientation, returns re-arm on the original side
golden_zone_redraw_1030: true   # owner 2026-10-26 (Q-fibvariants): step-13 variant; off = the 10:00 drawing and IB high/low stay all day
sweep_max_depth: 15             # NQ pts
sweep_reclaim_bars: 3           # 1-minute bars
retest_tol_ticks: 4
retest_lookback_sessions: 10
atr_period: 14                  # sessions
rotation_min_pts: 0.25          # x ATR
rv_lookback_sessions: 20
mx_bucket_days: [7, 45]          # owner 2026-10-24 (F2.23): 0DTE / 1-7 / 8-45 calendar days; later expirations left out
mx_snapshot_delay_sec: 30        # F2.23: a 09:25/10:00 snapshot is in force (and called live) this long after its instant
mx_wall_reach_em: 3              # F2.23: walls farther than this from price (EM units) are ignored
em_level_sigmas: [-2, -1, 1, 2]   # owner 2026-10-14, never tuned (F3.11): expected-move lines at C x (1 + k x em_1d_pct / 100),
                                  # C = previous NQ RTH close, em_1d_pct = Tempest's calendar-day 1-day move (QQQ row; ES: SPY)

# --- Volume profile (§5.3) ------------------------------------------------------------------------
va_edge_sweep: false                # owner 2026-10-26 (Q-vaedge): step-13 variant; true = prev VAH/VAL sweep-eligible like highs/lows (F3.9)
prev_profile_anchor: globex_1800_1700  # owner 2026-10-26 (Q-vaedge): step-13 variant; rth_0930_1600 = the previous session's RTH only (F3.2b)
lvn_smooth_ticks: 8                 # Gaussian sigma = lvn_smooth_ticks / 2 (owner 2026-10-05, FQ-10)
lvn_gauss_trunc_sigma: 3            # kernel truncated at +/- this many sigma; owner 2026-10-05 (SPEC §13 Q42)
lvn_max_pct: 0.3
lvn_merge_pts: 5
profile_update_sec: 60
tpo_tick_pts: 1
sp_min_ticks: 8

# --- Dark pools (§3.1) ---------------------------------------------------------------------------
dp_top_n: 3
dp_lookback_days: 45
dp_band: 0.5                    # QQQ $; owner confirms at step 13
dp_lag_sessions: 1              # measured (step 7 late-print check 2026-10-22: 5 of 5 mornings, no print or top-3 list changed)
dp_tickers: [QQQ, SPY]          # §3.1: QQQ prints are NQ levels, SPY prints ES cross-market features
dp_history_start: "2026-04-01" # first trade date Skylit's Flowseeker serves (step 7, 2026-10-06; QQQ and SPY each checked):
                                # earlier dates answer an empty, charged 200, so they are never pulled or cached (§3.1)
dp_in_model: false              # owner 2026-10-06: dark-pool levels and features stay out of the first model (events and
                                # features) until enough training months have them; added and tested at a later retrain
dp_min_notional: 1000000        # USD, the API's default floor; step 7 checks the top-3 lists lose nothing by it

# --- Vol context (§5.2) ---------------------------------------------------------------------------
tempest_lag_sessions: 1         # step 7 decided 2026-10-12 (§5.2): rows out by 09:00 both mornings, pre-open copies of
                                # 10-08/10-09 unchanged on re-pull (0 cells); step 22 re-checks it live

# --- Skylit structure (§5.2) ------------------------------------------------------------------------
ib_avg_sessions: 20
rug_gap_strikes: 1              # owner 2026-10-05: negative node at most 1 strike step from the positive one
pika_cloud_min_nodes: 2         # owner 2026-10-05
pika_cloud_min_pct: 0.25        # owner 2026-10-24 (was 0.10): members are relevant nodes (enter at this, stay until < node_drop_pct), adjacent strikes; = min_node_pct_of_king
air_pocket_max_pct: 0.10        # owner 2026-10-24 (was 0.02 from 2026-10-05): air pockets = runs of small nodes (< 10% of King) price travels through easily
magnet_min_dist_em: 0.1           # expected moves; fixed; approved 2026-10-05 (feature_spec F15)
roll_switch_min_sec: 60           # s; window W for confirmed ceiling/floor switches (F2.11, Q6/Q9, owner 2026-10-25); start 60,
                                  # tuned at step 13 on months 1-4 by structure-model log loss (tune_grids_13.features_logloss)
king_switch_min_sec: 60           # s; window W for confirmed King switches (F2.16, Q6/Q28, owner 2026-10-25); start 60, tuned the same way
node_switch_incumbent_max_share: 0.25  # owner rule 2026-10-25, never tuned: a confirmed node switches only if it led less than this share of W
rainbow_min_nodes_per_sign: 2   # owner 2026-10-05; fixed
rainbow_max_dominance: 1.5      # owner 2026-10-05; fixed
bias_deadband: 0.05               # velocity-lean units; fixed; step 12 checks it against the 1-min lean; approved 2026-10-05 (feature_spec F15)
smt_lookback_min: 15              # NQ/ES divergence; fixed; approved 2026-10-05 (feature_spec F15)
rel_delta_sec: 60                 # NQ vs ES relative delta; fixed; approved 2026-10-05 (feature_spec F15)

# --- Mapping (§5.1) ---------------------------------------------------------------------------------
mapping:
  ratio_outlier_bps: 3
  ratio_reaccept_n: 3
  ratio_open_skip_sec: 120
  mapping_p95_max: {QQQ: 1.0, NDXP: 0.5, SPY: 0.25, SPX: 0.25}   # NQ pts for QQQ/NDXP, ES pts for SPY/SPX
  atlas_match_tol: {NQ: 4.05, ES: 0.80}  # FROZEN (owner 2026-10-19, §13 Q8b-frozen; step 8b, recordings 10-09 to 10-19,
                                         # findings R15/R16): the gate's crossing p95 QQQ 4.046 / SPY 0.795 rounded up
                                         # to 0.01 (was 4.0 / 0.78, owner 2026-10-08, Q8b-5);
                                         # a regression check, information only (the owner's replay is the gate)
  atlas_regression_min_share: 0.90       # alert if fewer crossings than this, pooled over the sample days, fall within it
  # step 8b, owner 2026-10-08 (§5.1, F1.1, F1.7); NDXP: QQQ x k (owner 2026-10-19, §13 Q8b-1), no ratio of its own
  ratio_window_sec: {QQQ: 60, SPY: 60, SPX: 0, NDXP: null}   # trailing median of R over this many seconds; 0 = per board
  ndxp_r_method: qqq_k             # FROZEN (owner 2026-10-19, §13 Q8b-frozen; ndxp-select, recordings 10-09 to 10-19,
                                   # findings R15/R16): R_NDXP = R_QQQ in force / k
  ndxp_k_sessions: 20              # FROZEN (same): k = NDX close / QQQ close averaged over the previous 20 sessions
                                   # (dividend-adjusted)
  ratio_gap_reset_sec: 10          # a board gap longer than this resets the trailing window
  skylit_stamp_change_date: 2026-03-17   # Skylit asOf convention changed (before: whole seconds, content later in the second)
  board_content_offset_ms:         # board content time = floor(asOf) + this; F is read there (median measured, findings R4)
    before_stamp_change: {QQQ: 740, SPY: 840, SPX: -80, NDXP: null}
    from_stamp_change: {QQQ: -60, SPY: -60, SPX: -80, NDXP: null}
    live: {QQQ: -60, SPY: -60, SPX: -80, NDXP: null}   # live boards = post-03-17 history (parity 10-07); QQQ and SPY -60
                                                       # FROZEN (owner 2026-10-19, §13 Q8b-frozen; recordings 10-09 to 10-19
                                                       # scatter about +-0.4 s around it, findings R15/R16)
  # mapping-dislocation guard (owner 2026-10-14, SPEC §5.1/§9, §13 Q-dislguard, feature_spec F1.8): a data-quality guard,
  # fixed from data quality, never tuned on trade results
  disl_guard_pct: 0.002            # 0.2% of R
  disl_guard_window_sec: 120       # within 2 minutes (trailing)
  disl_guard_confirm_sec: 10       # per-board trigger: both ends held by two boards within 10 s
  disl_guard_hold_sec: 60          # blocked until 60 s after the last flagged board
  disl_guard_maps: [QQQ, SPY, SPX] # NDXP follows QQQ's block (its R is QQQ x k, owner 2026-10-19, §13 Q8b-1)

