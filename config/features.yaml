# Detector, mapping and structure parameters (SPEC §11 "Where settings live", §5).
# Values are the SPEC's start values. `null  # step 5` = no SPEC value yet: proposed in docs/feature_spec.md
# at step 5, approved at step 6. Frozen execution parameters are added here at step 13/19,
# marked `frozen_from: months 1-4` (§7.1).
features_version: 0

# --- Structure (§5.2-§5.4b) -----------------------------------------------------------------------
zone_proximity: null            # step 5 (NQ pts)
es_zone_proximity: null         # default = zone_proximity x ES / NQ price at the session open
confluence_tol: null            # step 5
max_zone_width: 60              # NQ pts
rearm_dist: 10                  # NQ pts
entry_reprice_tol: 2            # NQ pts
chart_level_half_width: null    # per level type; frozen at step 13 from the reaction-distance report
chart_level_half_width_cap: null
node_band: {QQQ: 0.5, SPY: 0.5, SPX: 5, NDXP: 20}   # in each underlying's own units; NDXP confirmed at step 13
min_node_pct_of_king: 0.25      # owner
node_drop_pct: 0.20
lean_window: null               # step 5 (minutes)
velocity_lookback_sec: 60
regime_band: null               # step 5 (% of spot)
flip_margin: 0                  # per level type, tuned at step 13 on months 1-4
flip_bar_minutes: 5
ib_fib_start_minute: 20         # owner rule, never tuned (golden zone opens 09:50)
ib_lock_minute: 30              # owner rule, never tuned (all setups from 10:00)
sweep_max_depth: 15             # NQ pts
sweep_reclaim_bars: 3           # 1-minute bars
retest_tol_ticks: 4
retest_lookback_sessions: 10
atr_period: 14                  # sessions
rotation_min_pts: 0.25          # x ATR
rv_lookback_sessions: 20

# --- Volume profile (§5.3) ------------------------------------------------------------------------
lvn_smooth_ticks: 8
lvn_max_pct: 0.3
lvn_merge_pts: 5
profile_update_sec: 60
tpo_tick_pts: 1
sp_min_ticks: 8

# --- Dark pools (§3.1) ---------------------------------------------------------------------------
dp_top_n: 3
dp_lookback_days: 45
dp_band: 0.5                    # QQQ $; owner confirms at step 13
dp_lag_sessions: 1              # step 7 late-print check may raise it

# --- Vol context (§5.2) ---------------------------------------------------------------------------
tempest_lag_sessions: 1         # step 7 decides (if in doubt, 2)

# --- Skylit structure (§5.2) ------------------------------------------------------------------------
roll_window_min: null           # step 5
ib_avg_sessions: 20
rug_gap_strikes: 1              # owner 2026-10-05: negative node at most 1 strike step from the positive one
pika_cloud_min_nodes: 2         # owner 2026-10-05
pika_cloud_min_pct: 0.10        # owner 2026-10-05: members >= 10% of King, adjacent strikes
air_pocket_max_pct: 0.02        # owner 2026-10-05: air pockets = runs of small nodes (< 2% of King) price travels through easily
magnet_min_dist_em: null        # step 5 part 2 (NEW, expected moves)
node_switch_min_sec: null       # step 5 part 2 (NEW; King and ceiling/floor switches)
rainbow_min_nodes_per_sign: null  # step 5 part 2 (NEW)
rainbow_max_dominance: null     # step 5 part 2 (NEW)
bias_deadband: null             # step 5 part 2 (NEW, velocity-lean units)
smt_lookback_min: null          # step 5 part 2 (NEW, NQ/ES divergence)
rel_delta_sec: null             # step 5 part 2 (NEW, NQ vs ES relative delta)

# --- Mapping (§5.1) ---------------------------------------------------------------------------------
mapping:
  ratio_outlier_bps: 3
  ratio_reaccept_n: 3
  ratio_open_skip_sec: 120
  mapping_p95_max: {QQQ: 1.0, NDXP: 0.5, SPY: 0.25, SPX: 0.25}   # NQ pts for QQQ/NDXP, ES pts for SPY/SPX
  atlas_match_tol: {NQ: 1.0, ES: 0.5}

