pair_end_hold_pts: 20             # NQ pts; owner 2026-11-06 (Q-density (c), Q-step11h (1)): no pair at or after the event's own F11.4 resolution at this distance
retest_hold_pts: 20               # NQ pts; owner 2026-11-06 (Q-density (c)): a F3.8 retested extreme comes from a touch held at this distance
react_pts: 10                     # NQ pts; label; approved 2026-10-05 (feature_spec F15)
react_minutes: 5                  # label; approved 2026-10-05 (feature_spec F15)
react_width_q: 0.8                # label; approved 2026-10-05 (feature_spec F15)
hold_window_min: 30               # label; approved 2026-10-05 (feature_spec F15)
trig_fav_ticks: 20                # label; approved 2026-10-05 (feature_spec F15)
trig_adv_ticks: 12                # label; approved 2026-10-05 (feature_spec F15)
trig_window_sec: 120            # a label parameter, fixed

# --- Day type (§7.1) -------------------------------------------------------------------------------
daytype_snapshot_min: 15
daytype_max_features: 8
daytype_inputs:                 # <= daytype_max_features (F3.10, F15 row 45); approved 2026-10-05
  - minutes_since_open
  - ib_width_ratio
  - vwap_crosses
  - vwap_side_share
  - new_extreme_skew
  - range_vs_em
  - regime_net_ndxp
  - rv_iv_ratio
trend_close_pct: 0.20
trend_max_vwap_crosses: 2
daytype_cross_bar_minutes: 5    # owner 2026-10-27 (Q-dtcross), never tuned: a day-type VWAP/POC cross = a settled clock-aligned bar of this length (F0.5), not a 1-minute close
# Q-er (owner 2026-10-28, built 2026-11-01): LightGBM day-type challenger candidates only, never in the 8 inputs or the label
er_bar_minutes: 5               # owner rule (Q-er): Kaufman's Efficiency Ratio on clock-aligned 5-minute bars
er_windows_min: [30, 60, 120]   # owner 2026-11-01: er_<w> windows = the Q-v2 Idea 3 example set (§13 Q-step11f); never tuned
vr_q: 6                          # owner rule (Q-er): Lo-MacKinlay variance ratio of 5-minute log returns at q = 6
vr_sessions: 10                  # owner rule (Q-er): over the prior 10 full RTH sessions (completed only)

# --- Pre-declared tuning grids (docs/feature_spec.md F16.4-F16.5; approved 2026-10-05) --------------
# Searched on months 1-4 in one coordinate pass in the order listed (each grid holds its start value);
# order type x time-to-live is a full joint grid per style. Winners are written above, frozen_from: months 1-4.
tune_grids_13:
  detectors:                      # scored on all events (sweep_reclaim_bars: style (c) trades only)
    zone_proximity: [2, 5, 8, 12]
    confluence_tol: [5, 10, 15, 20]
    sweep_max_depth: [10, 15, 25, 40]
    sweep_reclaim_bars: [1, 2, 3, 5]
    flip_margin:                  # one value per group, written to each of its level types
      groups:
        gex_nodes: [qqq_node, ndxp_node]
        chart_lines: [vwap, vwap_band, poc, lvn, single_print, dark_pool, em_level, va_edge]
        highs_lows: [on_extreme, pdh_pdl, prior_rth, prior_week, ib, retested_extreme]
      values: [0, 2, 5]
  golden_zone_variants:           # owner 2026-10-26 (Q-fibvariants): the 4 combinations, events rebuilt per variant on months 1-4, day-blocked
                                  # CV total net R per month (bootstrap policy) decided on all trades of the sequential run, golden-zone
                                  # trades reported beside it, each fold's bar on the shared events (Q-step12a (5)); the current design
                                  # (true, true) stays unless a variant is higher with the 95% day-block bootstrap interval of the
                                  # difference excluding 0 (several: the largest lower bound); written with frozen_from: months 1-4
    golden_zone_flip: [true, false]
    golden_zone_redraw_1030: [true, false]
  vaedge_variants:                # owner 2026-10-26 (Q-vaedge): va_edge_sweep first (va_edge trades reported), then prev_profile_anchor at its
                                  # winner (events touching prev_poc / prev_vah / prev_val reported); events rebuilt on months 1-4, day-blocked
                                  # CV total net R per month (bootstrap policy) decided on all trades of the sequential run, each fold's bar on
                                  # the shared events (Q-step12a (5)); the current value (first) stays unless the other is higher with the
                                  # 95% day-block bootstrap interval of the difference excluding 0; frozen_from: months 1-4
    va_edge_sweep: [false, true]
    prev_profile_anchor: [globex_1800_1700, rth_0930_1600]
  node_variants:                  # searched in this order after vaedge_variants, each value rebuilding the events on months 1-4, decided on all
                                  # trades of the sequential run with each fold's bar on the shared events (Q-step12a (5)); the current value
                                  # (first) stays unless the other is higher with the 95% day-block bootstrap interval of the difference
                                  # excluding 0; frozen_from: months 1-4
    node_relevance_top_n: [null, 5]                 # owner 2026-11-06 (Q-step12 (2)); null = off; trades at zones with a QQQ/NDXP node member reported
    node_role_at_formation: [approach, strike_side] # owner 2026-11-04 (Q-step12a (4)); trades at zones with a QQQ/NDXP node member reported
  retest_variants:                # owner 2026-11-05 (Q-density (d)): after node_variants, scored the same way; 10 (first) stays unless another is
                                  # higher with the interval excluding 0; if both 3 and 5 are, the larger lower bound wins
    retest_lookback_sessions: [10, 3, 5]            # trades at zones with a retested-extreme member reported
  features_logloss:               # owner 2026-10-25 (Q29): feature-only parameters, events and labels unchanged, searched LAST (after the
                                  # execution parameters): day-blocked CV log loss of the structure model on months 1-4 on the fixed event
                                  # set, the rows recomputed by engine runs (~24 h, Q-dryrun13 (4)); if node_relevance_top_n = 5 won they
                                  # change which nodes become NQ levels and are scored as event-changing variants instead; roll first
                                  # (king at 60), then king (roll at its winner); a value replaces 60 only if its log loss is lower and
                                  # the 95% day-block bootstrap interval of the difference excludes 0; under 60 behaves as 60 on 1-minute days
    roll_switch_min_sec: [30, 60, 120, 300]
    king_switch_min_sec: [30, 60, 120, 300]
  execution:                      # styles (c) and (d), each on its own single-style policy
    entry_order_type:             # per style; (d) also limit_center = a passive limit at the zone's centre (a single Skylit
                                  # node: the mapped strike); owner 2026-10-28, SPEC §13 Q-strikeentry
      c: [limit, marketable_limit, stop_limit]
      d: [limit, marketable_limit, stop_limit, limit_center]
    entry_ttl_sec: [10, 30, 60, 120, 300]
    stop_buffer: [1, 2.5, 5, 8, 12]   # pooled (c)+(d) trades; stop_buffer_floor applies per stop (F7)
tune_grids_19:
  detectors_a:                    # absorption, scored on style (a) trades
    abs_volume: [150, 300, 600]
    abs_ticks: [4, 8, 12]
    abs_seconds: [15, 30, 60]
    abs_refills: [1, 3, 5]
    abs_push_ticks: [0, 4, 8]
  detectors_b:                    # scored on style (b) trades
    imb_ratio: [2.5, 3.0, 4.0]
    imb_window_sec: [30, 60, 120]
    imb_min_volume: [10, 20, 40]
    imb_stack_min: [1, 2, 3, 4]
    exh_lookback_sec: [10, 15, 30]
    exh_decay_ratio: [0.35, 0.5, 0.7]
    div_lookback_sec: [30, 60, 120]
    div_min_pts: [1, 2, 4]
  execution:
    entry_order_type: {a: [marketable_limit, stop_limit], b: [marketable_limit, stop_limit, limit]}
    entry_ttl_sec: [2, 5, 10, 30]
    abs_stop_buffer: [2, 3.5, 5, 8]      # every style's trades with stop candidate 5
    abs_stop_window_sec: [60, 120, 300]
