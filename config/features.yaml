and the full warm-up build; 1: golden-zone upper fib 0.786 -> 0.79; 2: expected-move (sigma) levels F3.11; 3: mapping-dislocation guard F1.8 (owner 2026-10-14); 4: opening-range fib 09:45 start, 10:30 redraw, flips, and feature additions B2-B5 (owner 2026-10-16); 5: features during a dislocation block, guard windows reset at the session start only, B1 volume baselines and relative detector thresholds (owner 2026-10-17); 6: Skylit's VIX row, its close only as vix_ref_chg (Q-vix, owner 2026-10-20); 7: expected-move unit = Tempest's em_1d_pct as stored (Q-svxwknd, owner 2026-10-22); 8: post-cross retests and cross features F2.6b, gameplan zones break past the far edge (Q-flipretest, owner 2026-10-23); 9: previous-session profile levels and context, single-contract weekly, xb_settled_1m, stacked single prints, multi-expiration context (Q-amt, Q-multiexp, owner 2026-10-24; feature freeze until step 16); 10: air pockets below 10% of the King, was 2% (owner 2026-10-24, a correction of an existing definition); 11: pika-cloud members are relevant nodes, 0.25 in / node_drop_pct out (owner 2026-10-24, a correction); 12: in_pika_cloud on S&P maps = cloud band +/- es_zone_proximity contains the ES price (owner 2026-10-24); 13: Trinity and es_at_level by the overlap rule over [touch, t], aligned node not crossed at t (owner 2026-10-24); 14: owner answers to the Skylit-understanding questions (2026-10-25): lean = above minus below on magnitude velocity, confirmed King / ceiling / floor by lead time (roll_switch_min_sec, king_switch_min_sec, node_switch_incumbent_max_share), price switches at once from futures vs band, signed roll_steps, Trinity counts provisional roles; 15: golden-zone flip and 10:30 redraw become step-13 variants golden_zone_flip / golden_zone_redraw_1030, start true (Q-fibvariants, owner 2026-10-26); 16: a new extreme before 10:00 that reverses the golden-zone orientation makes a new zone (owner 2026-10-26); 17: S&P entry features for VAH/VAL area events, es_at_level and area_sp_* (Q-areasp, owner 2026-10-26; built with area events at step 19); 18: Q-areasp follow-ups: stats from the first-overlapping node still counting, area_sp_count null during an S&P block like trinity_count, overlap checked at every ES/NQ trade and board apply (owner 2026-10-26); 19: es_at_level during a dislocation block by the narrower Q-dislguard-2 (a) rule, level and area events, F1.8 fixed to match (owner 2026-10-26); 20: step-13 variants va_edge_sweep and prev_profile_anchor (Q-vaedge, owner 2026-10-26; start = current rules); 21: golden zone split into a shallow (0.5-0.618) and a deep (0.618-0.79) zone, each its own container, golden_zone_part (Q-gzsplit, owner 2026-10-27); 22: the deep golden zone is touched only by a trade past 0.618, its own touch group (Q-gzsplit answer, owner 2026-10-27); 23: day-type VWAP/POC crosses on settled 5-minute bars (Q-dtcross, owner 2026-10-27); 24: POC crosses out of the day-type label, trend_max_poc_crosses removed (Q-dtcross follow-up, owner 2026-10-27); 25: with_day_direction and vwap_side_vs_trade in the structure model and pair scorer (Q-trenddir, owner 2026-10-27); 26: the front contract by the previous-session volume rule, F0.4 (Q-frontroll, owner 2026-10-30); 27: step-11 clarifications Q-step11a: level state machines run from the level's creation, xb_vol_rel / xb_delta_rel over the RTH seconds spent beyond, single-print band edge (owner 2026-10-31); 28: Q-step11b points 1-7 approved as built (retested extremes end by age only, ES ratio before the open, single-print ids, VAH/VAL between instants, damage union, since-the-cross; owner 2026-10-31); 29: Q-step11b (8): a reclaim and a resume need the cross back / crossed-side move confirmed by the level's own rule (owner 2026-10-31); 30: Q-step11c: highs/lows start as ceiling / floor when price is on the range side as they appear, IB roles at the lock (owner 2026-10-31); 31: Q-step11d: S&P node flip_margin keys, multi-expiration walls re-chosen at t, rel_delta over aggressor volume, NDXP spot = QQQ spot x k and its R = QQQ's R at its t_apply / k, Trinity's Q19 entry rule on every map, blocked moments skipped in the overlap search (null if no overlap and part of the window blocked) (owner 2026-10-31); 32: Q-step11d (8)-(11) after the review: S&P Trinity null also for a Nasdaq-leg block, multi-expiration stale cutoff = previous close - 1 min, pocket gap to the next node beyond price, no bar judged that formed partly while frozen (owner 2026-10-31); nothing was built under 0-31 (step 11 part 1 code only, no feature files)

# --- Structure (§5.2-§5.4b) -----------------------------------------------------------------------
zone_proximity: 5                 # NQ pts; FROZEN frozen_from months 1-4 (owner 2026-11-21, step 13c row 1, SPEC §13 Q-step13c (e)): the start value kept; approved 2026-10-05 (feature_spec F15)
es_zone_proximity: null         # derived, not set: zone_proximity x ES / NQ price at the session open (F0.11)
confluence_tol: 10                # NQ pts; tuned at step 13 (F16.4); approved 2026-10-05 (feature_spec F15)
max_zone_width: 60              # NQ pts (the hard cap: no zone is ever wider)
zone_join_buffer: 5             # NQ pts; owner 2026-11-04 (Q-step12a (2)): a join or a zone merge needs the merged width <= max_zone_width - this (F5.3 (c), (d)); never tuned
zone_qualify_buffer: 5          # NQ pts; owner 2026-11-04 (Q-step12a (2)): a kept member stays while it qualifies with another kept member within this much more (bands <= this apart, or centres <= confluence_tol + this; F5.3 (b)); never tuned
rearm_dist: 10                  # NQ pts (also a crossed member's own re-arm for its post-cross retests, Q-step12b (c), (d))
entry_reprice_tol: 2            # NQ pts
# Chart-level half-widths per level type (NQ pts; F5.14, F15 rows 3-4): the start values for steps 11-12 (approved 2026-10-05) were 4
# (single prints 0); frozen_from: months 1-4 (owner 2026-11-10, SPEC §13 Q-step13a-2): the step-13a reaction-distance report (build
# 58b311aa6985, 84 sessions, reading B + the return rule, q0.8 of all CME hours clipped to the cap, to the tick; <reports_dir>/step13/reactions.md):
# the six line types at the 12-pt cap (measured q0.8 12.1-15.2), the highs/lows as measured, prior_week = the pooled highs/lows fallback
# (69 reactions), single_print its start value 0; all-hours widths kept over the RTH-only ones (the four flagged types differ by 1-2 ticks).
chart_level_half_width: {vwap: 12, vwap_band: 12, poc: 12, lvn: 12, on_extreme: 9, pdh_pdl: 8.5, prior_rth: 8, prior_week: 8.25, ib: 8.25, retested_extreme: 8.25, single_print: 0, em_level: 12, va_edge: 12}   # frozen_from: months 1-4
chart_level_half_width_cap: {vwap: 12, vwap_band: 12, poc: 12, lvn: 12, on_extreme: 12, pdh_pdl: 12, prior_rth: 12, prior_week: 12, ib: 12, retested_extreme: 12, single_print: 6, em_level: 12, va_edge: 12}
node_band: {QQQ: 0.375, SPY: 0.5, SPX: 5, NDXP: 15}   # in each underlying's own units; SPY/SPX fixed (owner); NDXP and QQQ frozen_from: months 1-4
                                                    # (SPEC §13 Q-step13a-2: the smallest of ±10/15/20 NQ pts covering the reaction q0.8; NDXP owner 2026-11-10,
                                                    # q0.8 13.14 NDXP $, was 20; QQQ owner 2026-11-12 (7), 392 reactions, q0.8 $0.36, was 0.5)
min_node_pct_of_king: 0.25      # owner
node_drop_pct: 0.20
node_relevance_min_sec: 60      # owner 2026-11-04 (Q-step12a (3)): a marginal join (>= min_node_pct_of_king, < node_relevance_fast_pct) and every leave
                                # (< node_drop_pct) count only once held this long in board time (F2.4); every map and the pika cloud (owner 2026-11-09); 0 = no debounce
node_relevance_fast_pct: 0.40   # owner 2026-11-04 (Q-step12a (3)): a node at >= this % of King becomes relevant at once (at that board)
node_relevance_top_n: null      # owner 2026-11-06 (Q-step12 (2)): step-13 variant (tune_grids_13.node_variants); null = off; 5 = on QQQ/NDXP only the 5
                                # largest-|value| relevant nodes become NQ levels (confirmed King / ceiling / floor at any rank); map state and features keep all
node_relevance_top_n_leave_rank: 7  # owner 2026-11-06 (Q-step12 (2)): a ranked node leaves only below this rank (or below node_drop_pct)
node_role_at_formation: approach    # owner 2026-11-04 (Q-step12a (4)): step-13 variant; approach = F2.6 step 1; strike_side = a QQQ/NDXP node becoming relevant
                                    # with the next trade inside its touch band takes its strike-side role and that trade is a touch (F5.6)
lean_window: 1                  # minutes; owner 2026-10-05 (accumulation shifts quickly); fixed
velocity_lookback_sec: 60
regime_band: 1                  # % of spot; owner 2026-10-05; fixed
flip_margin: {qqq_node: 0, ndxp_node: 0, vwap: 0, vwap_band: 0, poc: 0, lvn: 0, single_print: 0, dark_pool: 0, on_extreme: 0, pdh_pdl: 0, prior_rth: 0, prior_week: 0, ib: 0, retested_extreme: 0, em_level: 0, va_edge: 0}
                                # NQ pts per level type (start 0); tuned at step 13 per group (tune_grids_13), written per type;
                                # ES-side types use their NQ counterpart x ES/NQ at the open (F0.11): SPY/SPX nodes = gex_nodes group,
                                # SPY dark pools = chart_lines, ES ON high/low and PDH/PDL = highs_lows
flip_bar_minutes: 5
ib_fib_start_minute: 15         # owner rule, never tuned (golden zone opens 09:45; owner 2026-10-16, was 20)
ib_lock_minute: 30              # owner rule, never tuned (all setups from 10:00)
ib_redraw_minute: 60            # owner 2026-10-16, never tuned: one fib/IB redraw at 10:30 if the range widened after 10:00 (§5.8, F10)
golden_fib_levels: [0.5, 0.618, 0.705, 0.79]   # owner rule, never tuned (§5.8, F10): the fib levels recorded in the golden zone
golden_zone_upper_fib: 0.79     # owner 2026-10-14 (was 0.786), never tuned: the zone's far edge (settled-past invalidation, stop candidate 2)
golden_zone_split_fib: 0.618    # owner 2026-10-27 (Q-gzsplit), never tuned: shallow zone 0.5-0.618, deep zone 0.618-0.79; a settle past it breaks the shallow zone only
golden_zone_flip: true          # owner 2026-10-26 (Q-fibvariants): step-13 variant (tune_grids_13.golden_zone_variants); off = the 0.79
                                # invalidation ends the setup, the drawing keeps its orientation, returns re-arm on the original side
golden_zone_redraw_1030: true   # owner 2026-10-26 (Q-fibvariants): step-13 variant; off = the 10:00 drawing and IB high/low stay all day
sweep_max_depth: 10             # NQ pts; FROZEN frozen_from months 1-4 (owner 2026-11-21, step 13c row 3, SPEC §13 Q-step13c (e): owner's pick under the (c)/(d) flag; start 15)
sweep_reclaim_bars: 2           # 1-minute bars; FROZEN frozen_from months 1-4 (owner 2026-11-21, step 13c row 4, SPEC §13 Q-step13c (e); start 3)
retest_tol_ticks: 4
retest_lookback_sessions: 10
atr_period: 14                  # sessions
rotation_min_pts: 0.25          # x ATR
rv_lookback_sessions: 20
mx_bucket_days: [7, 45]          # owner 2026-10-24 (F2.23): 0DTE / 1-7 / 8-45 calendar days; later expirations left out
mx_snapshot_delay_sec: 30        # F2.23: a 09:25/10:00 snapshot is in force (and called live) this long after its instant
mx_wall_reach_em: 3              # F2.23: walls farther than this from price (EM units) are ignored
em_level_sigmas: [-2, -1, 1, 2]   # owner 2026-10-14, never tuned (F3.11): expected-move lines at C x (1 + k x em_1d_pct / 100),
                                  # C = previous NQ RTH close, em_1d_pct = Tempest's calendar-day 1-day move (QQQ row; ES: SPY)

# --- Volume profile (§5.3) ------------------------------------------------------------------------
