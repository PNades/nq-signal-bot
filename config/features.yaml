imb_stack_min: null             # step 5 part 2 (NEW, FQ-17)
cvd_slope_sec: null             # step 5 part 2 (NEW)
tob_window_sec: null            # step 5 part 2 (NEW, refills/pulls)
imb_window_sec: null            # step 5 part 2 (NEW; rolling footprint window)
exh_lookback_sec: null          # step 5
exh_decay_ratio: null           # step 5
div_lookback_sec: null          # step 5
div_min_pts: null               # step 5
