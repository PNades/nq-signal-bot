<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CreamFlow">
  <title>CreamFlow</title>
  <defs>
    <linearGradient id="cf-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF1DC"/>
      <stop offset="1" stop-color="#E9D3A6"/>
    </linearGradient>
  </defs>
  <!-- the "C": a thick cream stroke, open to the right like a cup being poured -->
  <path d="M46.6 17.4 A21 21 0 1 0 46.6 46.6" fill="none" stroke="url(#cf-cream)" stroke-width="9" stroke-linecap="round"/>
  <!-- the flow: a gold line leaving the cup like a price trace -->
  <path d="M24 37 C30 37 31 27 37 27 S44 35 50 31 L56 26" fill="none" stroke="#E7BF72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="26" r="3.2" fill="#FF9A3C"/>
</svg>
