[project]
name = "nqbot"
version = "0.1.0"
description = "NQ GEX + order flow signal bot (personal use only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "databento",
    "discord.py",
    "httpx",
    "httpx-sse",
    "lightgbm",
    "matplotlib>=3.11.2",
    "pandas",
    "plotly",
    "polars",
    "psutil",
    "pyarrow",
    "pydantic",
    "python-docx>=1.2.0",
    "ruamel.yaml",
    "scikit-learn",
    "shap",
    "streamlit",
    "tzdata",
]

[project.scripts]
nqbot = "nqbot.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: heavy end-to-end tests; the full suite (`uv run nqbot test`, no arguments) always runs them, a targeted run may skip them with -m \"not slow\" (CLAUDE.md rule 14)",
]
